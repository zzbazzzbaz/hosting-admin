# Gitea Actions CI/CD 部署配置
# 自动构建 Vue 项目并部署到阿里云 OSS
name: Deploy to Aliyun OSS

# 触发条件：推送到 dev 分支时自动执行
on:
  push:
    branches:
      - dev
      - main

# 定义工作流任务
jobs:
  build-and-deploy:
    # 运行环境：使用自托管运行器（主机模式）
    # 直接在宿主机上运行，需要预先安装 Node.js 20+ 和 Git
    runs-on: ubuntu-22.04

    steps:
      # 步骤1：检出代码（使用原生 git 命令，不依赖 action）
      - name: 检出代码
        run: |
          # 配置 git 使用 token 认证（使用 HTTP 协议，不是 HTTPS）
          git config --global credential.helper store
          echo "http://oauth2:${GITEA_TOKEN}@gitea.chatgqt.top:3000" > ~/.git-credentials

          # 克隆代码（使用 HTTP 协议）
          git clone --depth=1 --branch=${{ github.ref_name }} \
            http://gitea.chatgqt.top:3000/${{ github.repository }} .
          echo "✅ 代码检出完成"
        env:
          GITEA_TOKEN: ${{ github.token }}

      # 步骤2：验证 Node.js 环境
      - name: 验证 Node.js 环境
        run: |
          echo "Node.js 版本："
          node --version
          echo "npm 版本："
          npm --version

      # 步骤3：配置 npm 使用国内镜像源
      - name: 配置 NPM 国内镜像源
        run: |
          npm config set registry https://registry.npmmirror.com

      # 步骤4：安装项目依赖
      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_OPTIONS: --max-old-space-size=4096  # 增加内存限制，避免构建时内存溢出

      # 步骤5：构建项目
      - name: 构建项目
        run: npm run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096

      # 步骤6：安装阿里云 OSS 工具（ossutil）
      - name: 安装 OSS 工具
        run: |
          # 下载 ossutil（使用阿里云国内链接）
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil
          mv ossutil-v1.7.18-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil --version

      # 步骤7：配置 OSS 认证
      - name: 配置 OSS 认证
        run: |
          # 配置 ossutil，使用 Gitea Secrets 中的凭证
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
                        -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
                        -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
                        -L CH \
                        --output-dir=/tmp/ossutil_output
        env:
          # OSS 端点（例如：oss-cn-hangzhou.aliyuncs.com）
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          # OSS AccessKey ID
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          # OSS AccessKey Secret
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      # 步骤8：上传到 OSS
      - name: 部署到 OSS
        run: |
          # 上传构建产物到 OSS（直接上传到 bucket 根目录）
          # -r: 递归上传目录
          # -f: 强制覆盖
          # -u: 只上传修改过的文件
          # --meta: 设置文件元数据
          ossutil cp -r -f -u \
            ./dist/ \
            oss://${{ secrets.OSS_BUCKET }}/ \
            --meta Cache-Control:public,max-age=31536000

          echo "✅ 部署成功！"
          echo "📦 构建产物已上传到: oss://${{ secrets.OSS_BUCKET }}/"
        env:
          # OSS 存储桶名称
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}

      # 步骤9：部署结果通知（可选）
      - name: 部署结果
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 部署成功！"
          echo "📝 提交信息: ${{ github.event.head_commit.message }}"
          echo "👤 提交者: ${{ github.event.head_commit.author.name }}"
          echo "🌿 分支: ${{ github.ref_name }}"
          echo "🔗 提交哈希: ${{ github.sha }}"
          echo "=========================================="
