  # 第二种部署方式：构建并推送到 OSS 对象存储
  deploy-to-oss:
    name: 构建并部署到 OSS
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装项目依赖
      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # 4. 构建项目
      - name: 构建项目
        run: npm run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096

      # 5. 部署到 OSS（使用官方 Action）
      - name: 部署到阿里云 OSS
        uses: YangHanlin/oss-deployment-action@v1
        with:
          # OSS 端点（例如：oss-cn-hangzhou.aliyuncs.com）
          oss-endpoint: ${{ secrets.OSS_ENDPOINT }}
          # 阿里云 AccessKey ID
          oss-accesskey-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          # 阿里云 AccessKey Secret
          oss-accesskey-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # OSS 目标路径（格式：oss://bucket-name/path）
          oss-path: oss://${{ secrets.OSS_BUCKET }}/
          # 本地构建产物目录
          local-path: ./dist/

      # 6. 部署结果通知
      - name: 部署结果
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 OSS 部署成功！"
          echo "📦 构建产物已上传到: oss://${{ secrets.OSS_BUCKET }}/"
          echo "📝 提交信息: ${{ github.event.head_commit.message }}"
          echo "👤 提交者: ${{ github.event.head_commit.committer.name }}"
          echo "🌿 分支: ${{ github.ref_name }}"
          echo "🔗 提交哈希: ${{ github.sha }}"
          echo "=========================================="
